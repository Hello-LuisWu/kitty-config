# 默认光标颜色：Gruvbox 风格的柔和黄色
cursor #fabd2f

# 光标覆盖位置的文字颜色：深灰色
cursor_text_color #282828

# 默认使用方块光标
cursor_shape block

# 窗口失焦时使用空心方块
cursor_shape_unfocused hollow

# 竖线光标的粗细，单位 pt
cursor_beam_thickness 1.5

# 下划线光标的粗细，单位 pt
cursor_underline_thickness 2.0

# 0 = 禁用闪烁
cursor_blink_interval 0

# 空闲 15 秒后停止闪烁
# 由于上面已经关闭闪烁，这项通常不会产生可见效果
cursor_stop_blinking_after 15.0


# 0 = 禁用拖尾；改成 1 可启用
cursor_trail 1

# 最快、最慢的拖尾衰减时间，单位秒
cursor_trail_decay 0.3 0.5

# 水平、垂直方向的最小移动距离，单位为字符单元格
cursor_trail_start_threshold 1

# none = 使用光标的背景颜色
cursor_trail_color none

# 如果启用拖尾，可以尝试以下着色器（二选一）
# custom_shaders cursor-trail-blaze
# custom_shaders cursor-trail-motion-blur

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

font_family Maple Mono NF CN
# font_family      Iosevka Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 18

# 行高调整（百分比）
adjust_line_height  100%

# 禁用连字（提高代码可读性）
disable_ligatures always

underline_hyperlinks always
# 多久不使用鼠标之后自动隐藏鼠标指针。
mouse_hide_wait 3.0

# window
# 内边距
window_padding_width           0

# 窗口不透明度
background_opacity             0.7

# 模糊
background_blur                30

# 去除标题栏
hide_window_decorations        no

# 按步长调整尺寸（更平滑）
resize_in_steps yes

# 关闭窗口时不确认（0=不确认）
confirm_os_window_close 0

# 初始窗口宽度（像素）
initial_window_width  1350

# 初始窗口高度（像素）
initial_window_height 1000

# 是否记住窗口尺寸（推荐关闭）
remember_window_size yes

# tab bar
tab_bar_edge                top
tab_bar_style               powerline
tab_powerline_style         slanted


map ctrl+p nth_window -1

# map ctrl+left neighboring_window left
# map shift+left move_window right
# map ctrl+down neighboring_window down
# map shift+down move_window up


# ============ 快捷键

# 窗口
# C-S-CR(d-cr)：新建窗口
# C-S-n(d-n)：新建独立窗口
# c-s-w(s-d-d)：关闭窗口
# c-s-r(d-r)：调整窗口大小
# c-s-]：下一个窗口
# c-s-[：上一个窗口
# c-s-f：向前移动窗口
# c-s-b：向后移动窗口
# ctrl+shift+`：将窗口移动至顶部
# c-s-1~9(d-1~0)：切换第1到第9个窗口
# c-s-f7:视觉焦点窗口
# c-s-f8： 可视化交换窗口


# 选项卡
# c-s-y(d-t)：新建tab
# c-s-q(d-w)：关闭选项卡
# c-s-right(s-d-])：切换下一个tab
# c-s-left(s-d-[)：切换上一个tab
# c-s-l：切换当前tab窗口布局
# c-s-.：向右移动tab
# c-s-,：向左移动tab
# c-s-a-t(s-d-i)：设置tab标题

map ctrl+cmd+u load_config_file
